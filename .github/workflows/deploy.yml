name: Check and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Type check, lint (including accessibility rules) and the simulator's unit tests.
      - run: npm run check

      # A user site (<owner>.github.io) lives at "/"; any other repository lives at "/<repo>/".
      - name: Work out base path and site URL
        id: pages
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          if [ "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" = "${OWNER}.github.io" ]; then
            echo "base=/" >> "$GITHUB_OUTPUT"
            echo "url=https://${OWNER}.github.io/" >> "$GITHUB_OUTPUT"
          else
            echo "base=/${REPO}/" >> "$GITHUB_OUTPUT"
            echo "url=https://${OWNER}.github.io/${REPO}/" >> "$GITHUB_OUTPUT"
          fi

      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base }}
          SITE_URL: ${{ steps.pages.outputs.url }}

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
